# The container's settings: every key not named here keeps its default
# (kds.conf.sample documents each one).

# Under the image's volume, so the data survives the container.
data_file = /var/lib/kds/kds.db
log_dir   = /var/lib/kds
log_file  = kdb.log

# Every interface inside the container, so the port can be published.
# compose.yaml publishes it on the host's loopback only: auth is off, so
# do not publish it wider without `auth = scram` and `tls = on`.
listen_address = 0.0.0.0
port = 15432

# Required, no default: 32768 frames x 8 KiB = 256 MiB of page memory.
buffer_pool_frames = 32768
